name: "Artcraft Windows Publish"

on:
  push:
    branches:
      - release
      - artcraft-release
      - artcraft-windows  # Additional branch for Windows testing

# This workflow creates Windows builds.
# On each push to the release branches it will create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-artcraft-windows:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install wreq dependencies
        run: |
          choco install cmake -y
          choco install strawberryperl -y
          choco install pkgconfiglite -y
          choco install llvm -y
          choco install nasm -y
        shell: cmd

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: |
          # Navigate to the frontend directory to install dependencies
          cd ./frontend

          npm cache clean --force

          echo "Installing all workspace dependencies..."
          npm ci

          echo "=== Version Information ==="
          echo "Node version:"
          node --version
          echo "NPM version:"
          npm --version

          # Remove mismatched @nx packages and reinstall with correct versions
          npm install --save-dev @nx/remix@21.1.1 @nx/js@21.1.1 @nx/react@21.1.1 @nx/vite@21.1.1 @nx/eslint@21.1.1

          echo "=== Nx versions after adjustment ==="
          npm list --depth=0 | findstr nx

      - name: Pre-build frontend to avoid Tauri build issues
        run: |
          # Build the frontend app from the correct directory
          cd ./frontend

          # Increase Node.js memory limit for the build
          $env:NODE_OPTIONS="--max-old-space-size=8192"

          # Use npx to ensure we use the local nx version
          echo "Building with npx nx..."
          npx nx run artcraft:build

          echo "Checking build output..."
          dir apps/artcraft/dist/ | Select-Object -First 10

          # Update Tauri config to skip the build (since we already built)
          cd ${{ github.workspace }}/crates/desktop/artcraft
          Copy-Item tauri.conf.json tauri.conf.json.bak

          # Set beforeBuildCommand to empty using PowerShell
          $config = Get-Content tauri.conf.json | ConvertFrom-Json
          $config.build.beforeBuildCommand = ""
          $config | ConvertTo-Json -Depth 10 | Set-Content tauri.conf.json

      - name: Provision embeddable Python for the Companion
        # Must run before "build and publish" below: tauri.conf.json's
        # bundle.resources copies companion/ (see artcraft-studio-plan/
        # SYSTEM_DESIGN.md §1/DEVOPS.md §2) wholesale into the installed
        # app's resource directory, so companion/python/ has to exist on
        # disk by the time `tauri build` runs, or the packaged app ships
        # with no interpreter and companion_launch_config.rs's packaged-mode
        # resolver falls through with an error. Uses python-build-standalone
        # (github.com/astral-sh/python-build-standalone) rather than
        # python.org's embeddable package - it already bundles pip, no
        # separate get-pip.py bootstrap/._pth edit needed, and the same tool
        # is used for the macOS build below for one consistent recipe
        # instead of two different ones.
        #
        # `gh release download --pattern` (not a hardcoded version-pinned
        # URL) so this doesn't silently break every time upstream cuts a
        # new dated release - it always grabs whatever asset in the latest
        # release matches this Python minor version + platform.
        #
        # Not exercised against a real `tauri build` in the session that
        # wrote this (no tauri/cargo-tauri CLI available there to test
        # with) - if this step's archive-layout assumption
        # (companion/python/python.exe landing at exactly that path after
        # extraction) turns out wrong, the explicit existence check at the
        # end is designed to fail this job loudly rather than let a broken
        # installer ship silently.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $companionDir = "${{ github.workspace }}/companion"
          gh release download --repo astral-sh/python-build-standalone `
            --pattern "cpython-3.11.*-x86_64-pc-windows-msvc-install_only.tar.gz" `
            --output python-standalone.tar.gz --clobber
          tar -xzf python-standalone.tar.gz -C $companionDir
          # Archive's own top-level "python/" directory lands directly at
          # companion/python/ - see this step's header comment.
          if (-not (Test-Path "$companionDir/python/python.exe")) {
            Write-Error "Expected $companionDir/python/python.exe after extracting python-build-standalone - archive layout assumption was wrong, see this step's comment."
            exit 1
          }
          & "$companionDir/python/python.exe" -m pip install --no-warn-script-location -r "$companionDir/requirements.txt"

      - name: build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          # NB(bt): This is needed by wreq. Hopefully it doesn't kill Tauri
          RUSTFLAGS: "-C target-feature=+crt-static"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the SQLx query cache for SQLite
          SQLX_OFFLINE: true
        with:
          projectPath: ./crates/desktop/artcraft
          tagName: artcraft-v__VERSION__ # the action automatically replaces __VERSION__ with the app version.
          releaseName: "ArtCraft v__VERSION__"
          releaseBody: "Production build of ArtCraft. See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
