[pytest]
; agent/tests/*.py import test helpers as `from tests.helpers...` (not
; `agent.tests.helpers...`), which only resolves if `agent/` itself is on
; sys.path - not the default when pytest's rootdir is companion/backend/.
; This was presumably handled by the original Stimma CI's own PYTHONPATH
; setup, which isn't visible from this checkout; pythonpath here is the
; config-only equivalent so `pytest` works out of the box from
; companion/backend/ without guessing at unknown original tooling.
pythonpath = agent
