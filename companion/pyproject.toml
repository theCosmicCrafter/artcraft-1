# Verified with `uv lock` + `uv export --no-hashes --no-dev --no-emit-project`:
# resolves cleanly (Python 3.12, this pass) and reproduces every package name
# in requirements.txt's existing transitive closure - only version numbers
# differ (expected: transitive deps aren't individually pinned here, so `uv`
# resolves them fresh against today's index rather than reproducing the
# exact snapshot requirements.txt was frozen at). requirements.txt remains
# the actual shipped/tested pin set for now - don't regenerate it from a
# fresh `uv lock` without re-testing the app against the newer transitive
# versions that would bring in.
[project]
name = "artcraft-studio-companion"
version = "0.1.0"
description = "Local Companion Service for ArtCraft Studio - library indexing/search, the agent, Flows, Darkroom, and ComfyUI/STP orchestration. Evolved from Stimma's backend; see backend/README.md and artcraft-studio-plan/SYSTEM_DESIGN.md."
# Pinned upper bound is not cosmetic: `pydantic==2.5.0`'s pinned `pydantic-core`
# has no prebuilt wheel for 3.13 and its source build fails outright under it
# (a stdlib `typing.ForwardRef._evaluate()` signature change) - confirmed by
# hitting this directly while verifying tests in this pass. 3.11 matches
# .github/workflows/companion-ci.yml's pinned interpreter; 3.12 also verified
# working locally for this same dependency set.
requires-python = ">=3.11,<3.13"
# Deliberately no [build-system]: the Companion runs from source
# (companion/run.cmd / run.sh -> python main.py), it is not built or
# published as an installable wheel. `uv` treats a pyproject.toml with no
# [build-system] as a virtual/non-package project - dependency locking still
# works via `uv lock` / `uv export` without one.
dependencies = [
    # This list was reconstructed from requirements.txt's own `uv export`
    # provenance comments (packages annotated "# via stimma-backend" - i.e.
    # depended on directly by the original project, not pulled in only
    # transitively through another package). Kept in the same pinned form
    # requirements.txt already has, so `uv export` from this file reproduces
    # it exactly rather than drifting to different resolved versions.
    "aiohttp==3.9.1",
    "aiosqlite==0.19.0",
    "alembic==1.17.2",
    "bcrypt==5.0.0",
    "ddgs==9.11.3",
    "fastapi==0.104.1",
    "ffmpeg-python==0.2.0",
    "greenlet==3.0.1",
    "huggingface-hub==1.4.1",
    "numpy==1.26.2",
    "onnx==1.17.0",
    "onnx-clip==4.0.1",
    "onnxruntime==1.23.2",
    "osam==0.2.5",
    "piexif==1.1.3",
    "pillow==10.4.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "pypdfium2==5.6.0",
    "python-frontmatter==1.1.0",
    "python-multipart==0.0.6",
    "pyyaml==6.0.1",
    "rich==14.3.2",
    "ruamel-yaml==0.19.1",
    "scikit-image==0.23.2",
    "scipy==1.16.3",
    "secretstorage==3.5.0 ; sys_platform == 'linux'",
    "sqlalchemy==2.0.23",
    "sse-starlette==1.8.2",
    # NOT in the original uv-export "direct" set (it was transitive-only,
    # via fastapi/sse-starlette) - added explicitly because
    # core/companion_auth_middleware.py (added during the ArtCraft Studio
    # merge, after that export was taken) imports starlette directly for
    # the shared-secret auth handshake. Declaring what the code actually
    # imports, not relying on another package's transitive pull to keep
    # providing it.
    "starlette==0.27.0",
    "strip-markdown==1.3",
    "structlog==25.5.0",
    "trafilatura==2.0.0",
    # [standard] extra: requirements.txt's flat pinned list doesn't preserve
    # extras markers, but httptools/uvloop/watchfiles (which [standard]
    # pulls in) are present there as their own separate pinned lines -
    # without declaring the extra here, `uv lock` silently drops them
    # (ASGI still works without them, just without their perf optimizations,
    # so this would be an easy-to-miss regression rather than a hard break).
    "uvicorn[standard]==0.24.0",
    "weasyprint==68.1",
    "websockets==12.0",
]

[tool.ruff]
# Without this file, `ruff check .` had no config anywhere in the repo to
# discover, so its reported violation count depended entirely on whichever
# ruff version happened to be installed and that version's own implicit
# default rule selection - confirmed directly: `ruff check . --isolated`
# (no config, todays ruff 0.16.2) reports ~6400 violations across ~40 rule
# categories (UP, BLE, DTZ, SIM, TRY, PERF, S, PLR/PLC/PLE/PLW, ...), while
# `ruff check . --isolated --select E4,E7,E9,F` (ruff's own documented
# stable default) reports ~410 - matching companion-ci.yml's historical
# "~400 pre-existing violations" figure almost exactly. That figure was
# real, just implicitly dependent on a rule selection nothing pinned - the
# next ruff upgrade could have silently 15x'd or shrunk CI's lint surface
# with no code change. Pinning the same selection here makes the count
# reproducible and intentional again, independent of ruff version.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
# Mirrors requirements-dev.txt exactly - see that file's own comment for why
# it's separate from the main dependency list (dev-only tooling, not part of
# the runtime bundle).
dev = [
    "ruff>=0.15",
    "pytest>=8",
    "pytest-asyncio",
]
